# Configuracion de base de datos en memoria para tests
spring.datasource.url=jdbc:h2:mem:certtest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialecto H2 para JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Deshabilitar Flyway en tests
spring.flyway.enabled=false

# Deshabilitar Eureka en tests
eureka.client.enabled=false
spring.cloud.compatibility-verifier.enabled=false

# Propiedades requeridas por ClienteGroqCert
app.groq.api-key=test-key
app.groq.modelo=test-model
app.groq.url=http://localhost:9999
