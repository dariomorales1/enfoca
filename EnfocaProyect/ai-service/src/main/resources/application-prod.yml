spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${AI_DB_URL}
    username: ${AI_DB_USERNAME}
    password: ${AI_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: planes
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    schemas: planes
    default-schema: planes
    locations: classpath:db/migration
    out-of-order: true
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true
      timeout: 3000ms
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

server:
  port: 8085

eureka:
  instance:
    hostname: ${HOSTNAME:ai-service}
    prefer-ip-address: false
    instance-id: ${spring.application.name}:8085
  client:
    service-url:
      defaultZone: ${EUREKA_URL}
    register-with-eureka: true
    fetch-registry: false

enfoca:
  ia:
    proveedor-principal: groq
    groq:
      api-key: ${GROQ_API_KEY}
      url: https://api.groq.com/openai/v1/chat/completions
      modelo: llama-3.3-70b-versatile
    gemini:
      api-key: ${GEMINI_API_KEY:}
      url: https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
    limites:
      max-llamadas-por-hora: 10
      ttl-cache-horas: 24

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    diskSpace:
      enabled: true

logging:
  level:
    root: WARN
    online.enfoca: INFO
